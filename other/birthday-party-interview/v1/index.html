<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>生日派对 · 访谈助手</title><style>
:root{--bg:#fff;--surface:#f9f8f7;--line:#deddd9;--text:#2c2c2b;--muted:#62615e;--accent:#1868b5;--tint:#e5f2fc;--green:#287448}*{box-sizing:border-box}body{margin:0;font:16px/1.65,system-ui}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}button,input,textarea{font:inherit}button,summary{cursor:pointer}button{min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:9px 16px;border-radius:8px}button:hover{background:var(--surface)}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{max-width:1080px;margin:auto;padding:32px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.eyebrow{font-size:14px;letter-spacing:2px;color:var(--accent);font-weight:700}h1{font-size:32px;line-height:1.3;margin:8px 0}p{margin:8px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{filter:brightness(.9);background:var(--accent)}.intro{background:var(--surface);padding:20px 24px;border-radius:12px;margin:24px 0}.intro strong{font-size:14px;color:var(--muted)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}label{display:block;font-size:14px;color:var(--muted)}input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--bg);min-height:44px}input{margin-top:4px;min-width:0}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px}aside{position:sticky;top:20px;align-self:start}.progress-head{display:flex;justify-content:space-between;font-size:14px}.track{height:5px;background:var(--line);border-radius:4px;margin:10px 0 24px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0;transition:width .2s}nav{display:grid;gap:8px}nav button{text-align:left;border-color:transparent;display:flex;gap:12px;align-items:center}nav button[aria-current="step"]{background:var(--tint);color:var(--accent);font-weight:650}.num{font-size:14px;opacity:.85}h2{font-size:25px;line-height:1.4;margin:0 0 8px}.section-head{padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px}.question{border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.qid{color:var(--accent);font-size:14px;font-weight:700;letter-spacing:1px}.done{font-size:14px;display:flex;align-items:center;gap:8px;min-height:44px}.done input{width:20px;height:20px;min-height:20px;margin:0;accent-color:var(--green)}.question h3{font-size:18px;font-weight:600;line-height:1.7;margin:0 0 16px}.tip{padding:12px 16px;background:var(--surface);border-left:3px solid var(--accent);font-size:14px;margin-bottom:16px}details{margin:16px 0}summary{color:var(--accent);min-height:44px;padding:10px 0;font-size:14px;font-weight:600}ul{padding-left:22px;margin:8px 0}li{padding:4px 0}textarea{resize:vertical;min-height:100px;margin-top:6px;font-size:16px}.bottom{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0}.closing{border:1px solid var(--line);padding:20px;border-radius:12px;margin:16px 0}footer{border-top:1px solid var(--line);margin-top:32px;padding-top:16px;font-size:14px;color:var(--muted)}a{color:var(--accent)}#status{font-size:14px;color:var(--muted);min-height:24px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){.shell{padding:24px 16px}header{display:block}h1{font-size:28px}.actions{margin-top:20px}.intro{padding:16px}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{display:block}aside{position:static;margin-bottom:24px}nav{grid-template-columns:1fr 1fr;gap:8px}nav button{padding:10px;font-size:14px;border-color:var(--line)}.track{margin-bottom:16px}.question{padding:20px}h2{font-size:23px}.bottom{flex-wrap:wrap}}@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#242424;--line:#555550;--text:#fff;--muted:#bab9b5;--accent:#83baf2;--tint:#223344;--green:#72bc8f}.primary{background:#286dab;color:#fff;border-color:#286dab}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print{aside,.actions,.bottom,footer,#status{display:none}.layout{display:block}.question{break-inside:avoid}textarea{border:none}.shell{padding:0}.intro{margin:16px 0}}
</style></head><body><div class="shell"><header><div><div class="eyebrow">FIELD GUIDE / 生日派对运营调研</div><h1>把体验聊透，把原话留下。</h1><p class="muted">用户访谈助手 · 11 个主问题 / 4 个章节</p></div><div class="actions"><button class="primary" id="export">导出笔记</button><button id="reset">新建访谈</button></div></header><section class="intro" aria-label="开场与访谈信息"><strong>开场语</strong><p>您好！想聊聊您这次体验的生日服务和玩法。喜欢、不喜欢或没注意到都可以直说，回答仅用于改进服务。</p><div class="meta"><label>访谈日期<input id="date" type="date"></label><label>访谈人<input id="interviewer" placeholder="姓名"></label><label>品牌 / 门店<input id="store" placeholder="门店名称"></label><label>参与人数<input id="people" type="number" min="1" step="1" placeholder="人数"></label></div></section><div class="layout"><aside><div class="progress-head"><span>已问主问题</span><b id="progress">0 / 11</b></div><div class="track" role="progressbar" aria-label="访谈进度" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"><div class="bar"></div></div><nav aria-label="访谈章节"></nav><p id="status" role="status" aria-live="polite">记录仅保存在本机浏览器</p></aside><main id="main"></main></div><footer>不上传、不提交到服务器；请在结束后导出备份。共享设备上请导出后点「新建访谈」清除本机记录。<br>提纲来源：<a href="https://app.notion.com/p/40cc7394815f812b9c29c348777c5dfb" target="_blank" rel="noopener">Notion 用户访谈提纲</a> · 本页面不与原文自动同步。</footer></div><script>const D=[["参与背景与期待", "先确认角色，再了解选择与期待。", [["U1", "这次谁过生日？您是寿星、组织者还是亲友？是否负责预订？平时多久来一次 KTV？", [], []], ["U2", "为什么选这里过生日？来之前最期待什么？您觉得怎样才算办得好？", ["仅问预订人：从哪里知道这项服务？是否在小程序选过生日主题、定制氛围？操作时有什么问题影响了后续体验？", "平时还在哪里过生日？没有这项服务，这次会怎么安排？"], ["试点调研跳过"]]]], ["固定服务的体验评价", "先自由回忆，再逐项补问；未体验，只问原因。", [["U3", "从进包厢到派对结束，您记得哪些生日服务和玩法？什么印象最深？", [], ["先确认是否提供、是否注意、是否体验；体验过的，喜欢和不喜欢都要问。"]], ["U4", "刚进包厢时，您觉得生日氛围怎样？什么让您有这种感觉？", ["包厢布置｜注意到哪些布置？喜欢或不喜欢什么？对拍照、活动或寿星感受有什么影响？", "电视屏幕生日氛围｜注意到屏幕上的生日内容了吗？效果怎样？和包厢布置搭吗？哪些有印象，哪些没感觉？", "寿星定制版生日氛围（仅实际定制者）｜哪些地方让您觉得是为寿星定制的？寿星和亲友有什么反应？和普通生日画面有什么不同？"], []], ["U5", "生日仪式怎么开始、怎么进行？谁发起，大家怎么参与？整体感觉怎样？", ["生日歌｜听到或唱了什么？现场怎么配合？哪些带动气氛，哪些不合适？", "生日照｜生日照环节怎么进行？您和寿星有什么反应？哪些满意，哪些不满意？", "生日祝福｜有什么祝福，怎么呈现？您和寿星有什么反应？哪些有感觉，哪些普通或尴尬？", "仪式里最想保留的是哪一段？哪一段可以取消或缩短？为什么？", "有没有等待、操作中断、不知道下一步或反复找店员的情况？怎么解决的？"], []], ["U6", "以下玩法，哪些亲自玩过、只看别人玩过，或没体验过？", ["欢乐百宝箱—寿星的指令｜体验过吗？怎么玩、谁参与？什么印象最深？", "欢乐百宝箱—搞怪 pose｜体验过吗？怎么玩、谁参与？什么印象最深？", "欢乐百宝箱—疯狂猜词｜体验过吗？怎么玩、谁参与？什么印象最深？", "欢乐百宝箱—动起来｜体验过吗？怎么玩、谁参与？什么印象最深？", "欢乐百宝箱—热舞 PK｜体验过吗？怎么玩、谁参与？什么印象最深？", "拍照打卡｜体验过吗？在哪里、怎么拍？效果怎样，照片后来怎么处理？", "蹦迪狂欢｜体验过吗？怎么开始、谁参与？气氛和感受怎样？"], []], ["U7", "玩过的玩法中，最喜欢和最不喜欢哪个？也可以都喜欢或都不喜欢。结合经历说说原因。", ["逐个问玩过的玩法：哪里有趣、哪里无聊？规则和触摸屏操作好理解吗？有没有中途退出，为什么？", "哪些大家都能参与，哪些只有少数人玩？再玩一次，您会选哪个？"], ["没体验的，问原因：不知道、没时间、不感兴趣、不会操作，还是其他？「没玩」不等于「不喜欢」。"]]]], ["服务取舍与整体评价", "把体验评价落到具体取舍和改进。", [["U8", "包厢布置、屏幕氛围、生日仪式和玩法中，体验过的最多保留三项，您会选什么？按重要程度排序并说明理由。", ["去掉哪项最影响体验？哪项无所谓？为什么？"], []], ["U9", "这次派对和预期相比怎样？什么时候最开心、最失望？", ["具体发生了什么？是服务内容、店员执行、系统操作，还是门店环境的问题？", "只能先改一件事，您会改什么？还有哪些需求没满足？"], []]]], ["付费、推荐与再次选择", "区分口头愿意与真实付费；不提示价格区间。", [["U10", "这次生日服务免费体验。如果以后在正常 KTV 消费外另收费，哪些内容您会买，哪些不会？也可以都不买。为什么？", ["分别问包厢布置和生日主题触摸屏玩法：单独收费会买吗？什么情况下买或不买？只能选一项会选哪个，也可以都不选。", "对考虑购买的内容：能接受的总价是多少？包含哪些服务、供几人使用？超过多少就不买？让受访者先报价，不提示区间。", "自己出钱时，会和哪些安排比较？以前买过类似生日服务吗？花了多少？如果不由您决定或付钱，是谁决定、谁付？", "对不买或拿不准的内容：主要顾虑是什么？增加或改善什么后，才会考虑付费？"], ["记录时区分「口头愿意」和「过去付过费」，记下购买条件、价格及对应服务。免费体验不代表愿意付费。"]], ["U11", "朋友问起这次派对，您会推荐什么、提醒什么问题？", ["内容和玩法定期更新，会影响您下次选哪家 KTV 吗？还需满足什么条件？不更新会怎么选？", "有没有分享照片、视频或向朋友提起？为什么？未发生的不要求预判。"], []]]]];
const KEY='birthday-interview-v1';let S={meta:{},notes:{},done:{},section:0},storageOK=true;try{let raw=localStorage.getItem(KEY);if(raw){let v=JSON.parse(raw);S={...S,...v,meta:v.meta||{},notes:v.notes||{},done:v.done||{}}}}catch(e){storageOK=false}S.section=Math.max(0,Math.min(3,Number(S.section)||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));document.querySelector('#status').textContent='已自动保存到本机 · 请及时导出'}catch(e){storageOK=false;document.querySelector('#status').textContent='本机存储不可用，请导出笔记备份'}}
for(const id of ['date','interviewer','store','people']){let el=document.getElementById(id);el.value=S.meta[id]||'';el.addEventListener('input',()=>{S.meta[id]=el.value;save()})}
function progress(){let n=D.flatMap(s=>s[2]).filter(q=>S.done[q[0]]).length;document.getElementById('progress').textContent=n+' / 11';document.querySelector('.bar').style.width=n/11*100+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',n)}
function go(i,focus=false){S.section=i;save();render();if(focus){document.querySelector('h2').focus();document.querySelector('#main').scrollIntoView({block:'start',behavior:'instant'})}}
function render(){document.querySelector('nav').innerHTML=D.map((s,i)=>`<button ${S.section===i?'aria-current="step"':''} data-section="${i}"><span class="num">0${i+1}</span><span>${esc(s[0])}</span></button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>go(+b.dataset.section,true));let s=D[S.section];document.querySelector('#main').innerHTML=`<div class="section-head"><div class="eyebrow">章节 0${S.section+1} / 04</div><h2 tabindex="-1">${esc(s[0])}</h2><p class="muted">${esc(s[1])}</p></div>`+s[2].map(q=>`<article class="question"><div class="qtop"><span class="qid">${q[0]}</span><label class="done"><input type="checkbox" data-done="${q[0]}" ${S.done[q[0]]?'checked':''}>已问</label></div><h3>${esc(q[1])}</h3>${q[3].map(t=>`<div class="tip">${esc(t)}</div>`).join('')}${q[2].length?`<details><summary>展开追问 · ${q[2].length} 项</summary><ul>${q[2].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`:''}<label for="note-${q[0]}">访谈记录 · 尽量保留原话</label><textarea id="note-${q[0]}" data-note="${q[0]}" placeholder="记录具体经历、原话与待核实信息…">${esc(S.notes[q[0]]||'')}</textarea></article>`).join('')+(S.section===3?'<div class="closing"><b>结束语</b><p>这次生日服务，还有什么感受或经历没聊到？感谢分享！</p><label for="ending">补充记录</label><textarea id="ending" data-note="ending" placeholder="其他经历、感受或补充">'+esc(S.notes.ending||'')+'</textarea></div>':'')+`<div class="bottom"><button id="prev" ${S.section===0?'disabled':''}>上一章</button><span class="muted">${S.section+1} / 4</span><button id="next" class="primary">${S.section===3?'结束并导出':'下一章 →'}</button></div>`;document.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{S.notes[el.dataset.note]=el.value;save()});document.querySelectorAll('[data-done]').forEach(el=>el.onchange=()=>{S.done[el.dataset.done]=el.checked;save();progress()});document.querySelector('#prev').onclick=()=>go(S.section-1,true);document.querySelector('#next').onclick=()=>S.section===3?exportNotes():go(S.section+1,true);progress()}
function exportNotes(){let t='# 生日派对运营调研 · 访谈记录\n\n'+['date','interviewer','store','people'].map((id,i)=>['访谈日期','访谈人','品牌 / 门店','参与人数'][i]+'：'+(S.meta[id]||'未填写')).join('\n')+'\n\n';for(let s of D){t+='## '+s[0]+'\n\n';for(let q of s[2]){t+='### '+q[0]+' '+q[1]+'\n\n状态：'+(S.done[q[0]]?'已问':'未标记')+'\n\n'+(S.notes[q[0]]||'（无记录）')+'\n\n'}}t+='## 结束补充\n\n'+(S.notes.ending||'（无记录）')+'\n\n提纲来源：https://app.notion.com/p/40cc7394815f812b9c29c348777c5dfb\n';let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download='生日派对访谈记录-'+(S.meta.date||'未填日期')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);document.querySelector('#status').textContent='已发起导出，请确认文件已保存'}
document.querySelector('#export').onclick=exportNotes;document.querySelector('#reset').onclick=()=>{if(!confirm('请先确认已导出需要保留的笔记。新建访谈会清空当前记录，是否继续？'))return;S={meta:{},notes:{},done:{},section:0};for(const id of ['date','interviewer','store','people'])document.getElementById(id).value='';save();render()};render();if(!storageOK)document.querySelector('#status').textContent='本机存储不可用，请导出笔记备份';
</script></body></html>
